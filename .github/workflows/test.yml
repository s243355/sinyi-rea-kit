name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-server.txt
      - run: python tools/run_tests.py
      - run: python tools/validate_skills.py
      - run: python tools/validate_cards.py
      - run: python tools/pii_scan.py --all
